<!DOCTYPE html>
<html>
<head>
    <title>Social AI</title>
    <style>
        body{
            font-family:Arial,sans-serif;
            max-width:800px;
            margin:auto;
            padding:20px;
        }

        textarea{
            width:100%;
            height:120px;
            margin:10px 0;
        }

        button{
            background:#2563eb;
            color:white;
            border:none;
            padding:12px 20px;
            border-radius:8px;
            cursor:pointer;
        }

        #result{
            margin-top:20px;
            padding:15px;
            background:#f3f4f6;
            border-radius:8px;
        }
    </style>
</head>
<body>

<h1>AI Social Media Post Generator</h1>

<p>Describe your business:</p>

<textarea id="business"></textarea>

<button onclick="generatePost()">
Generate Post
</button>

<div id="result"></div>

<script>
function generatePost(){
    const business =
        document.getElementById("business").value;

    document.getElementById("result").innerHTML =
        "Post for: " + business +
        "<br><br>AI connection coming soon...";
}
</script>

</body>
</html>
